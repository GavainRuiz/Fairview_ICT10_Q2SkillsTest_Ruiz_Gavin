<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
 <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>SKILLSTEST</title>
    <style>
        :root {
            color-scheme: light;
            --ink: #26334a;
            --muted: #78849a;
            --accent: #607f9e;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            display: grid;
            place-items: center;
            padding: 32px 18px;
            color: var(--ink);
            text-align: center;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background:
                radial-gradient(ellipse at 15% 20%, rgba(207, 222, 228, .8), transparent 38%),
                radial-gradient(ellipse at 85% 80%, rgba(218, 214, 203, .72), transparent 36%),
                linear-gradient(135deg, #eef2f1 0%, #e6ebed 48%, #f1eee8 100%);
        }

        .container { max-width: 680px; }

        .planet-card {
            padding: clamp(30px, 6vw, 54px);
            border: 1px solid rgba(255, 255, 255, .8);
            border-radius: 22px;
            background: rgba(255, 255, 255, .82);
            box-shadow: 0 12px 32px rgba(49, 63, 79, .09), 0 2px 6px rgba(49, 63, 79, .04);
            backdrop-filter: blur(8px);
        }

        .eyebrow {
            margin: 0 0 10px;
            color: var(--accent);
            font-size: .72rem;
            font-weight: 700;
            letter-spacing: .16em;
            text-transform: uppercase;
        }

        h1 { margin-bottom: 10px; color: #293950; font-size: clamp(2rem, 5vw, 2.7rem); font-weight: 650; letter-spacing: -.045em; }
        .intro { margin-bottom: 28px; color: var(--muted); }
        .search-form { display: flex; gap: 10px; max-width: 440px; margin: 0 auto; }
        #element1 {
            min-width: 0;
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #d9e0e5;
            border-radius: 10px;
            outline: none;
            color: var(--ink);
            background: #fbfcfc;
            transition: border-color .2s, box-shadow .2s;
        }
        #element1:focus { border-color: #8da5bb; box-shadow: 0 0 0 3px rgba(96, 127, 158, .13); }
        .search-button {
            padding: 12px 17px;
            border: 0;
            border-radius: 10px;
            color: #fff;
            font-weight: 600;
            background: #536f8b;
            transition: background .2s, transform .2s;
        }
        .search-button:hover { background: #405d79; transform: translateY(-1px); }
        .result {
            margin-top: 30px;
            padding: 22px 24px;
            border: 1px solid #e7ebee;
            border-radius: 14px;
            background: #f8faf9;
            text-align: left;
        }
        .result h3 { margin-bottom: 17px; color: #42566e; font-size: 1rem; font-weight: 650; }
        .result p { display: flex; justify-content: space-between; gap: 16px; margin: 0; padding: 10px 0; border-top: 1px solid #e9edef; color: var(--muted); }
        .result b { color: #46566a; font-weight: 550; }
        .result span { color: var(--ink); text-align: right; }

        @media (max-width: 440px) {
            .search-form { flex-direction: column; }
            .search-button { width: 100%; }
            .result { padding: 18px; }
        }
    </style>
</head>
<body>
    <main class="container">
    <section class="planet-card">
    <p class="eyebrow">A little science reference</p>
    <h1>Element lookup</h1>
    <p class="intro">Enter an element symbol to find its details.</p>

    <div class="search-form">
        <input type="text" id="element1" placeholder="Try H or He" aria-label="Element symbol">
        <button class="search-button" py-click="search_element">Search</button>
    </div>
    <div class="result">
        <h3>Search Result</h3>
        <p><b>Element Code:</b> <span id="code"></span></p>
        <p><b>Element Name:</b> <span id="ElementName"></span></p>
        <p><b>Atomic Number:</b> <span id="AtomicNumber"></span></p>
        <p><b>Mass of element:</b> <span id="AtomicMass"></span></p>
    </div>
    </section>
    </main>
    <script type="py" src="main.py"></script>
</body>
</html>
